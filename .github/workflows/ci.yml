name: CI & Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --verbose

  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --all-targets

  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --all-targets

  build:
    name: Build (${{ matrix.os_name }})
    needs: [check-and-test, check-windows, check-macos]
    # Every push to master produces a downloadable build; PRs only run the checks.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Non-secret flag: lets a step test for R2 credentials without exposing them.
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            platform: linux-x86_64
            exe: seavx
            binary_name: seavx-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            platform: windows-x86_64
            exe: seavx.exe
            binary_name: seavx-windows-x86_64.exe
          # `install.sh` maps Darwin-arm64 to `latest/macos/arm64`, which the
          # worker resolves through `latest-macos-arm64.json`.
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            platform: macos-arm64
            exe: seavx
            binary_name: seavx-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compute short sha
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist pointer
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/${{ matrix.binary_name }}"
          # The sha-suffixed copy is the immutable record; the plain name stays the "latest" alias.
          cp "dist/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}-$SHORT_SHA"

      - name: Compute checksum
        shell: bash
        run: |
          set -euo pipefail
          file="dist/${{ matrix.binary_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$file" | cut -d' ' -f1)
          else
            # Windows without coreutils: certutil prints the hash on line 2.
            digest=$(certutil -hashfile "$file" SHA256 | sed -n '2p' | tr -d ' \r')
          fi
          echo "SHA256=$digest" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: seavx-${{ matrix.os_name }}-${{ env.SHORT_SHA }}
          path: dist/
          if-no-files-found: error

      - name: Install minisign
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y minisign ;;
            macOS)   brew install minisign ;;
            Windows) choco install minisign -y ;;
          esac

      - name: Mirror to R2
        if: env.HAS_R2 == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          key="builds/$SHORT_SHA/$SHA256/${{ matrix.binary_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          built_at=$(date -u +%FT%TZ)
          channel=$([[ "$GITHUB_REF" == refs/tags/* ]] && echo stable || echo edge)

          # Rerun safety: reuse the key only when the stored bytes are this build.
          if aws s3api head-object --bucket seavx --key "$key" --endpoint-url "$endpoint" >/dev/null 2>&1; then
            aws s3 cp "s3://seavx/$key" existing.bin --endpoint-url "$endpoint"
            actual=$(sha256sum existing.bin | cut -d' ' -f1)
            [[ "$actual" == "$SHA256" ]] || { echo "refusing to overwrite $key: digest differs" >&2; exit 1; }
            rm -f existing.bin
          else
            aws s3 cp "dist/${{ matrix.binary_name }}" "s3://seavx/$key" \
              --endpoint-url "$endpoint" --content-type application/octet-stream
          fi

          # $1 = the channel the manifest is signed for, $2 = the pointer object name.
          publish() {
            bash .github/scripts/pointer-manifest.sh "$1" "${{ matrix.platform }}" \
              "$SHORT_SHA" "$key" "$version" "$built_at" "$SHA256" > pointer/manifest.txt
            printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > pointer/minisign.key
            minisign -S -s pointer/minisign.key -m pointer/manifest.txt \
              -x pointer/manifest.sig -t "seavx $version"
            sig=$(python3 -c 'import json,sys; print(json.dumps(open(sys.argv[1]).read()))' pointer/manifest.sig)
            printf '{"channel":"%s","target":"%s","sha":"%s","key":"%s","version":"%s","built_at":"%s","sha256":"%s","sig":%s}\n' \
              "$1" "${{ matrix.platform }}" "$SHORT_SHA" "$key" "$version" "$built_at" "$SHA256" "$sig" \
              > "pointer/$2"
            aws s3 cp "pointer/$2" "s3://seavx/$2" --endpoint-url "$endpoint" \
              --content-type application/json --cache-control "public, max-age=60"
            rm -f pointer/minisign.key pointer/manifest.sig
          }

          if [[ "$channel" == stable ]]; then
            publish stable "latest-${{ matrix.platform }}.json"
          else
            publish edge "edge-${{ matrix.platform }}.json"
            # Rollout state 1: a master build also seeds latest-*, because the client's
            # default channel is stable and would otherwise refuse the only pointer there
            # is. Reading the published channel is the whole transition rule: once a tag
            # has written latest-*, master never touches it again. No tag query, no
            # workflow state to keep in sync.
            existing=$(aws s3 cp "s3://seavx/latest-${{ matrix.platform }}.json" - \
              --endpoint-url "$endpoint" 2>/dev/null || true)
            published=$(printf '%s' "$existing" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("channel",""))' 2>/dev/null || true)
            [[ "$published" == stable ]] || publish stable "latest-${{ matrix.platform }}.json"
          fi

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    name: Release notes
    needs: [build]
    # The assets job above creates the release on a tag; this one writes its
    # body, so a release always carries its counts, stats, PRs and contributors.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history: the notes are the range between two tags.
          fetch-depth: 0

      - name: Write the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/release-notes.sh > release-notes.md

      - name: Attach the body to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --notes-file release-notes.md

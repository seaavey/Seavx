name: "Bug Report / Agent Execution Failure"
description: Report an issue, tool error, or execution failure in Seavx AI Coding Agent
title: "[Bug]: <short summary of the failure>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! Include as much detail as you can so the agent or a maintainer can get straight to the root cause.

  - type: textarea
    id: prompt
    attributes:
      label: 1. Prompt / Task Given
      description: What task or prompt did you give Seavx when the failure happened?
      placeholder: "Example: seavx exec 'Read main.rs and edit the run function'"
    validations:
      required: true

  - type: dropdown
    id: execution_mode
    attributes:
      label: 2. Execution Mode
      description: How were you running Seavx?
      options:
        - "Interactive TUI (seavx / cargo run)"
        - "Headless CLI (seavx exec '...')"
        - "CLI Model Switcher (seavx model ...)"
    validations:
      required: true

  - type: input
    id: model_info
    attributes:
      label: 3. Model & Gateway Base URL
      description: Which model and endpoint are configured in .seavx/config.toml?
      placeholder: "Example: model = zen/deepseek-v4.1-flash-free, base_url = https://seavx.ai.id/v1/"
    validations:
      required: true

  - type: dropdown
    id: reasoning_effort
    attributes:
      label: 4. Reasoning Effort
      description: Which reasoning effort level was active?
      options:
        - "None / Zero"
        - "Minimal / Low"
        - "Medium"
        - "High"
        - "HighX"
        - "Max"
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: 5. Error Message Shown
      description: Paste the error message printed in the terminal / TUI.
      placeholder: "Error executing task: Web call failed..."
    validations:
      required: true

  - type: textarea
    id: tool_execution_trace
    attributes:
      label: 6. Tool Running When It Failed
      description: Which tool was called last before the crash? (read_file, run_command, save_memory, etc.)
      placeholder: "Example: Tool: list_directory(path='/workspace') failed because the path escapes the workspace"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 7. Log Excerpt (.seavx/debug.log / .seavx/request.log)
      description: Paste the last lines of `.seavx/debug.log` or `.seavx/request.log` (remove any api_key or other secrets before pasting).
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 8. Environment
      description: OS information and Seavx version.
      value: |
        - OS: Linux / macOS / Windows
        - Seavx Version: 0.1.0 (`seavx --version`)
        - Rust Version: (`rustc --version`)
    validations:
      required: true

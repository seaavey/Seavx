[package]
name = "seavx"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures = "0.3.31"
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, the only way to
# ask how many rows the word wrapper actually painted: the transcript scrolls in
# wrapped rows, and counting source lines stops short of the bottom.
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "fs", "sync", "time", "net", "io-util"] }
tui-textarea = "0.7.0"
async-trait = "0.1.92"
genai = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
schemars = "0.8.22"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
dotenvy = "0.15.7"
toml = "0.8.20"
toml_edit = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
indicatif = "0.17"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
unicode-width = "0.2"
# The status orb, from seaavey/thinking-orbs-rs: not published to crates.io, so
# it is pinned to the release commit rather than tracking a moving branch.
thinking-orbs-rs = { git = "https://github.com/seaavey/thinking-orbs-rs", rev = "5353e42e978d056bf1aaf0c6501341974ca41d72" }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Full debug info dominates dev link time; line tables keep useful backtraces.
debug = "line-tables-only"
